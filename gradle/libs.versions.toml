# Single source of truth for every version in the build.
# Gradle turns this file into type-safe accessors: libs.ktor.client.core, libs.plugins.kotlin.multiplatform, ...

[versions]
kotlin = "2.4.20"
agp = "9.4.0"   # needs Android Studio Quail 4+ / Rabbit
ktor = "3.6.0"
# OkHttp under Ktor's Android engine, held below Ktor 3.6.0's 5.5.0: OkHttp 5.4.0's AAR asks apps for compileSdk 36,
# 5.5.0+ asks for 37 (scripts/check-aar-metadata.sh prints this). Raise it only together with android-sdkCompileSdk.
okhttp = "5.4.0"
coroutines = "1.11.0"
serialization = "1.11.0"
androidx-core = "1.16.0"   # 1.17+ needs newer AGP / compileSdk than many host apps have; keep it low

# Sample app only
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
maplibre = "13.5.2"
android-targetSdk = "36"

# Android target settings
android-compileSdk = "37"      # the sample app
# The SDK compiles against 36: its AAR then asks host apps for compileSdk 36+, which AGP 8.x apps (Flutter,
# React Native, many native apps) can use. Raising it raises that floor for every customer.
android-sdkCompileSdk = "36"
android-minSdk = "24"

[libraries]
# Networking (Ktor). The core + plugins live in commonMain; each platform adds its own engine.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }

# Sample app only
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
maplibre-android = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }   # sample app only

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

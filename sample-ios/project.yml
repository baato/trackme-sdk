# XcodeGen spec: generates TrackMeSample.xcodeproj so no hand-edited project file lives in git.
#   brew install xcodegen
#   cd sample-ios && xcodegen && open TrackMeSample.xcodeproj
#
# The SDK is linked with KMP's "direct integration": a build phase runs Gradle's
# embedAndSignAppleFrameworkForXcode, which builds TrackMeSDK.framework for the exact
# simulator/device + Debug/Release you picked in Xcode.
name: TrackMeSample
options:
  bundleIdPrefix: io.baato.trackme
  deploymentTarget:
    iOS: "15.0"
configFiles:
  Debug: Secrets.xcconfig     # DEMO ONLY, git-ignored. Copy Secrets.example.xcconfig → Secrets.xcconfig
  Release: Secrets.xcconfig
packages:
  TrackMeLiveActivity:
    path: ../TrackMeLiveActivity   # local Swift package in this repo
  MapLibre:                        # the live map (Baato breeze style)
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.29.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # the Gradle build phase writes outside the sandbox
targets:
  TrackMeSample:
    type: application
    platform: iOS
    sources:
      - TrackMeSample
    info:
      path: TrackMeSample/Info.plist
      properties:
        CFBundleDisplayName: TrackMe Sample
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Share your live location with members of your trip.
        NSLocationAlwaysAndWhenInUseUsageDescription: Keep sharing your location with your trip while the app is in the background.
        UIBackgroundModes: [location]          # enables background sharing; without it sharing works only while open
        NSSupportsLiveActivities: true         # lock-screen Live Activity (iOS 16.1+)
        TrackMeApiSecret: $(TRACKME_API_SECRET) # DEMO ONLY: read by DemoAuth.swift
        BaatoAccessToken: $(BAATO_ACCESS_TOKEN) # Baato map style key, read by BaatoMap.swift
        TrackMeDevTools: $(TRACKME_DEV_TOOLS)   # YES = Developer screens next to the Live map; empty = on for Debug only
    dependencies:
      - target: TrackMeSampleWidget          # embedded into the app's PlugIns
      - package: TrackMeLiveActivity
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.baato.trackme.sample
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../trackme-sdk/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework TrackMeSDK
    preBuildScripts:
      - name: Build TrackMe SDK (Kotlin)
        basedOnDependencyAnalysis: false
        script: |
          # Xcode doesn't inherit your shell's JAVA_HOME: fall back to Android Studio's JDK.
          if [ -z "$JAVA_HOME" ]; then
            if [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
              export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
            else
              export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null)"
            fi
          fi
          cd "$SRCROOT/.."
          ./gradlew :trackme-sdk:embedAndSignAppleFrameworkForXcode

  # Widget Extension that draws the Live Activity (lock screen + Dynamic Island).
  TrackMeSampleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - TrackMeSampleWidget
    dependencies:
      - package: TrackMeLiveActivity
    info:
      path: TrackMeSampleWidget/Info.plist
      properties:
        CFBundleDisplayName: TrackMe Live Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.baato.trackme.sample.widget
        SKIP_INSTALL: YES
